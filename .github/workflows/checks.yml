name: Pipeline checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.1 nbformat==5.10.4
      - name: Check prediction and validation contracts
        run: python -m pytest -q
      - name: Check the Colab notebook
        run: python scripts/check_notebook.py
      - name: Check imports and native model fits
        run: python scripts/check_environment.py
