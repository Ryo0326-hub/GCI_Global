name: Pipeline checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.1 nbformat==5.10.4
      - name: Check prediction and validation contracts
        run: python -m pytest -q
      - name: Check the Colab notebook
        run: python scripts/check_notebook.py
